{% extends 'base.html' %}
{% load static %}

{% block title %}Find Friends - Zentry{% endblock %}

{% block content %}
<style>
    .find-friends-container {
        max-width: 1000px;
        margin: 2rem auto;
        padding: 0 1rem;
    }
    
    .find-friends-header {
        margin-bottom: 2rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid var(--dark-3);
    }
    
    .find-friends-header h1 {
        font-size: 2.2rem;
        background: linear-gradient(to right, #e2e8f0, #8b5cf6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 1rem;
    }
    
    .search-section {
        margin-bottom: 2rem;
    }
    
    .search-input {
        width: 100%;
        padding: 1rem;
        border-radius: 0.5rem;
        background-color: var(--dark-3);
        border: 1px solid var(--dark-3);
        color: var(--light);
        font-family: 'Inter', sans-serif;
        font-size: 1rem;
    }
    
    .search-input:focus {
        outline: none;
        border-color: var(--primary-light);
    }
    
    .users-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 1.5rem;
    }
    
    .user-card {
        background-color: var(--dark-2);
        border-radius: 1rem;
        padding: 1.5rem;
        border: 1px solid var(--dark-3);
        transition: all 0.3s ease;
        text-align: center;
    }
    
    .user-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        border-color: var(--primary-light);
    }
    
    .user-avatar {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        font-weight: bold;
        color: white;
        margin: 0 auto 1rem;
        border: 3px solid var(--primary);
    }
    
    .user-avatar img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
    }
    
    .user-info h3 {
        margin-bottom: 0.5rem;
        color: var(--light);
    }
    
    .user-info p {
        color: var(--light);
        opacity: 0.8;
        margin-bottom: 1rem;
    }
    
    .user-stats {
        display: flex;
        justify-content: center;
        gap: 1.5rem;
        margin-bottom: 1.5rem;
    }
    
    .user-stat {
        text-align: center;
    }
    
    .user-stat-value {
        display: block;
        font-size: 1.2rem;
        font-weight: 700;
        color: var(--primary-light);
    }
    
    .user-stat-label {
        font-size: 0.8rem;
        opacity: 0.7;
    }
    
    .user-actions {
        display: flex;
        justify-content: center;
        gap: 0.5rem;
    }
    
    .empty-state {
        text-align: center;
        padding: 3rem;
        color: var(--light);
        opacity: 0.7;
        grid-column: 1 / -1;
    }
    
    .loading {
        text-align: center;
        padding: 2rem;
        color: var(--primary-light);
        grid-column: 1 / -1;
    }
    
    @media (max-width: 768px) {
        .users-grid {
            grid-template-columns: 1fr;
        }
        
        .user-stats {
            flex-direction: column;
            gap: 0.5rem;
        }
    }
</style>

<div class="find-friends-container">
    <div class="find-friends-header">
        <h1>Find Friends</h1>
        <p>Connect with other users and build your productivity network</p>
    </div>
    
    <div class="search-section">
        <input type="text" class="search-input" placeholder="Search by username, name, or profession..." id="user-search">
    </div>
    
    <div class="users-grid" id="users-container">
        <div class="loading">
            <p>Loading users...</p>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const usersContainer = document.getElementById('users-container');
        const searchInput = document.getElementById('user-search');
        let searchTimeout;
        
        // Load users on page load
        loadUsers();
        
        // Search functionality
        searchInput.addEventListener('input', function() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                loadUsers(this.value);
            }, 500);
        });
        
        function loadUsers(query = '') {
            usersContainer.innerHTML = '<div class="loading"><p>Loading users...</p></div>';
            
            fetch(`/api/users/?search=${encodeURIComponent(query)}`, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.users && data.users.length > 0) {
                    renderUsers(data.users);
                } else {
                    usersContainer.innerHTML = `
                        <div class="empty-state">
                            <p>No users found</p>
                            <p>Try adjusting your search terms</p>
                        </div>
                    `;
                }
            })
            .catch(error => {
                console.error('Error:', error);
                usersContainer.innerHTML = `
                    <div class="empty-state">
                        <p>Error loading users</p>
                        <p>Please try again later</p>
                    </div>
                `;
            });
        }
        
        function renderUsers(users) {
            usersContainer.innerHTML = '';
            
            users.forEach(user => {
                const userCard = document.createElement('div');
                userCard.className = 'user-card';
                
                userCard.innerHTML = `
                    <div class="user-avatar">
                        ${user.pfp ? 
                            `<img src="${user.pfp}" alt="${user.username}">` : 
                            `${user.username.charAt(0).toUpperCase()}`
                        }
                    </div>
                    <div class="user-info">
                        <h3>${user.full_name || user.username}</h3>
                        <p>@${user.username}</p>
                        ${user.profession ? `<p>${user.profession}</p>` : ''}
                    </div>
                    <div class="user-stats">
                        <div class="user-stat">
                            <span class="user-stat-value">${user.friends_count || 0}</span>
                            <span class="user-stat-label">Friends</span>
                        </div>
                        <div class="user-stat">
                            <span class="user-stat-value">${user.tasks_count || 0}</span>
                            <span class="user-stat-label">Tasks</span>
                        </div>
                    </div>
                    <div class="user-actions">
                        <button class="btn btn-primary send-request" data-user-id="${user.id}">
                            Add Friend
                        </button>
                    </div>
                `;
                
                usersContainer.appendChild(userCard);
            });
            
            // Add event listeners to send request buttons
            document.querySelectorAll('.send-request').forEach(btn => {
                btn.addEventListener('click', function() {
                    const userId = this.getAttribute('data-user-id');
                    sendFriendRequest(userId);
                });
            });
        }
        
        function sendFriendRequest(userId) {
            fetch(`/accounts/friend-request/${userId}/`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    'X-CSRFToken': getCookie('csrftoken')
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('Friend request sent successfully!');
                    // Update button state
                    const button = document.querySelector(`.send-request[data-user-id="${userId}"]`);
                    button.textContent = 'Request Sent';
                    button.disabled = true;
                    button.classList.remove('btn-primary');
                    button.classList.add('btn-outline');
                } else {
                    alert('Error: ' + data.error);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred while sending the friend request');
            });
        }
        
        // Helper function to get CSRF token
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    });
</script>
{% endblock %}
